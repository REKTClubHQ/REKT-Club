<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">
<title>REKT CLUB — Admin Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=League+Gothic&display=swap" rel="stylesheet">
<style>
:root{--lime:#c7ef45;--paper:#eee7d8;--ink:#070707}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:#070707;color:var(--paper);font-family:"IBM Plex Mono",monospace}
.wrap{min-height:100vh;display:grid;place-items:center;padding:28px;position:relative;overflow:hidden}
.wrap:before{content:"";position:absolute;inset:0;background:linear-gradient(#0b0b0b 1px,transparent 1px),linear-gradient(90deg,#0b0b0b 1px,transparent 1px);background-size:44px 44px;opacity:.34;pointer-events:none}
.card{width:min(470px,100%);position:relative;z-index:1;border:1px solid #2b2b2b;background:#090909;padding:34px}
.brand{font:700 10px/1 "IBM Plex Mono",monospace;letter-spacing:.23em;color:var(--lime);text-transform:uppercase;margin-bottom:18px}
h1{font:400 64px/.86 "League Gothic",sans-serif;letter-spacing:.01em;margin:0 0 16px}
.copy{color:#7e7e78;font-size:11px;line-height:1.7;margin:0 0 24px}
label{display:block;color:#a3a39c;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
input{width:100%;background:#101010;border:1px solid #313131;color:#f5f0e5;padding:15px 14px;outline:none;font:600 12px "IBM Plex Mono",monospace}
input:focus{border-color:var(--lime)}
button{width:100%;margin-top:10px;border:0;background:var(--lime);color:#050505;padding:15px 14px;font:700 10px "IBM Plex Mono",monospace;letter-spacing:.17em;text-transform:uppercase;cursor:pointer}
button:disabled{opacity:.45;cursor:wait}
.msg{min-height:16px;margin-top:13px;color:var(--lime);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.corner{position:absolute;left:28px;bottom:22px;color:#3f3f3b;font-size:8px;letter-spacing:.16em;text-transform:uppercase;z-index:1}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <div class="brand">REKT CLUB / INTERNAL</div>
    <h1>ACCESS REQUIRED</h1>
    <p class="copy">Restricted workspace. Authorized access only.</p>
    <form id="loginForm">
      <label for="key">Admin password</label>
      <input id="key" type="password" autocomplete="current-password" autofocus>
      <button id="submitBtn" type="submit">Enter Admin</button>
      <div class="msg" id="msg"></div>
    </form>
  </main>
  <div class="corner">REKT CLUB // PRIVATE SYSTEM</div>
</div>
<script>
async function openDashboard(){
  const r=await fetch('/api/admin-dashboard',{credentials:'same-origin'});
  if(!r.ok)return false;
  const html=await r.text();
  document.open();document.write(html);document.close();
  return true;
}
(async()=>{ await openDashboard(); })();

document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const key=document.getElementById('key').value;
  const btn=document.getElementById('submitBtn');
  const msg=document.getElementById('msg');
  if(!key){msg.textContent='Enter admin password.';return}
  btn.disabled=true;msg.textContent='Checking access…';
  const r=await fetch('/api/admin-auth',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'same-origin',
    body:JSON.stringify({key})
  });
  let data={};try{data=await r.json()}catch(_){}
  if(!r.ok){
    btn.disabled=false;
    msg.textContent=data.error||'Access denied.';
    document.getElementById('key').select();
    return;
  }
  msg.textContent='Access granted.';
  if(!(await openDashboard())){
    btn.disabled=false;
    msg.textContent='Could not open admin workspace.';
  }
});
</script>
</body>
</html>
