<!doctype html>
<!-- production refresh -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#292929">
  <title>REKT CLUB — Mint Live</title>
  <style>
    :root{--lime:#c7ef45}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#292929}
    body{font-family:Arial,Helvetica,sans-serif}
    #live{position:relative;width:100vw;height:100dvh;min-height:100vh;background:#292929;overflow:hidden}
    .live-art{position:absolute;inset:0;background:#292929;overflow:hidden}
    .live-frame{position:absolute;left:0;top:0;height:100vh;height:100dvh;width:201.812vh;width:201.812dvh}
    .live-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}
    .live-opensea-hotspot{
      position:absolute;left:4.62%;top:63.20%;width:20.25%;height:4.55%;z-index:8;
      display:flex;align-items:center;gap:.62em;text-decoration:none;cursor:pointer;padding:0 1.05%;
      color:#f3eee4;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:clamp(9px,.98vw,18px);font-weight:700;letter-spacing:.045em;text-transform:uppercase;
      white-space:nowrap;line-height:1;transition:filter .2s ease,transform .2s ease
    }
    .live-opensea-hotspot .live-dot{
      width:.72em;height:.72em;min-width:.72em;border-radius:50%;background:var(--lime);
      box-shadow:0 0 .45em rgba(199,239,69,.95),0 0 1.05em rgba(199,239,69,.6);
      animation:liveGlow 1.55s ease-in-out infinite
    }
    .live-opensea-hotspot:hover{filter:brightness(1.15);transform:translateY(-1px)}
    .live-opensea-hotspot:focus-visible{outline:2px solid var(--lime);outline-offset:3px}

    .leaf-field{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
    .leaf{
      --size:22px;--fall:18s;--delay:0s;--wind:120px;--opacity:.7;
      position:absolute;top:-16vh;left:50%;width:var(--size);height:calc(var(--size)*1.18);
      opacity:0;animation:fall var(--fall) linear var(--delay) infinite
    }
    .leaf>span{display:block;width:100%;height:100%;animation:sway var(--sway,4s) ease-in-out infinite alternate}
    .leaf svg{width:100%;height:100%;display:block;filter:drop-shadow(0 5px 10px rgba(0,0,0,.1));animation:tumble var(--spin,5s) ease-in-out infinite}
    @keyframes fall{
      0%{opacity:0;transform:translate3d(0,-12vh,0)}
      8%,84%{opacity:var(--opacity)}
      100%{opacity:0;transform:translate3d(var(--wind),126vh,0)}
    }
    @keyframes sway{from{transform:translateX(-26px) rotate(-11deg)}to{transform:translateX(22px) rotate(9deg)}}
    @keyframes tumble{0%{transform:rotate(0) rotateX(0)}50%{transform:rotate(210deg) rotateX(48deg)}100%{transform:rotate(410deg) rotateX(-18deg)}}
    @keyframes liveGlow{
      0%,100%{opacity:.82;box-shadow:0 0 .35em rgba(199,239,69,.9),0 0 .8em rgba(199,239,69,.45)}
      50%{opacity:1;box-shadow:0 0 .6em rgba(199,239,69,1),0 0 1.4em rgba(199,239,69,.78)}
    }
    @media(max-width:700px){
      .live-opensea-hotspot{font-size:clamp(6px,1.7vw,10px);gap:.5em}
    }
    @media(prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>
  <main id="live" aria-label="REKT CLUB Mint Live">
    <div class="live-art">
      <div class="live-frame">
        <img src="https://res.cloudinary.com/rvyiestw/image/upload/v1791293894/mint-live2.png" alt="REKT CLUB Mint Live artwork">
        <a class="live-opensea-hotspot" href="https://opensea.io/" target="_blank" rel="noopener noreferrer" aria-label="Live now on OpenSea">
          <span class="live-dot" aria-hidden="true"></span>
          <span>Live Now on OpenSea</span>
        </a>
      </div>
    </div>
    <div class="leaf-field" id="liveLeafField" aria-hidden="true"></div>
  </main>

  <script>
    const shapes=[
      '<svg viewBox="0 0 70 84"><path fill="VAR" d="M35 3C27 14 15 19 11 33c-5 16 1 33 16 41 13 7 26 1 31-13 7-20-7-40-23-58Z"/><path d="M35 10c-4 19-7 36-8 57" stroke="rgba(30,28,21,.28)" stroke-width="2" fill="none"/></svg>',
      '<svg viewBox="0 0 76 82"><path fill="VAR" d="M38 4 47 22 64 17 58 34 72 43 54 50 58 69 40 60 29 78 24 58 6 64 13 45 2 34 21 30 23 11 38 22Z"/></svg>'
    ];
    const palette=['#c7ef45','#d8f08d','#efe3c1','#b39b6b','#1a1a1a'];
    const liveLeafField=document.getElementById('liveLeafField');
    for(let i=0;i<(innerWidth<800?10:16);i++){
      const f=document.createElement('div');
      f.className='leaf';
      f.style.left=(Math.random()*104-2)+'%';
      f.style.setProperty('--size',(12+Math.random()*24)+'px');
      f.style.setProperty('--fall',(12+Math.random()*12)+'s');
      f.style.setProperty('--delay',(-Math.random()*22)+'s');
      f.style.setProperty('--wind',(40+Math.random()*180)+'px');
      f.style.setProperty('--opacity',(.46+Math.random()*.34));
      f.style.setProperty('--sway',(2.8+Math.random()*3.4)+'s');
      f.style.setProperty('--spin',(3.4+Math.random()*4.8)+'s');
      const s=document.createElement('span');
      s.innerHTML=shapes[Math.floor(Math.random()*shapes.length)].replace('VAR',palette[Math.floor(Math.random()*palette.length)]);
      f.appendChild(s);
      liveLeafField.appendChild(f);
    }
  </script>
</body>
</html>
